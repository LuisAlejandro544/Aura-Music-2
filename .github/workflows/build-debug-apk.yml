# ==============================================================================
# build-debug-apk.yml — GitHub Action para compilar Aura Music en APK Debug
# ------------------------------------------------------------------------------
# Qué hace este workflow:
#   1. Descarga todo el repositorio del proyecto.
#   2. Detecta automáticamente si la app Flutter está en `aura_music/` o en la
#      raíz del repositorio.
#   3. Configura y cachea Java 17, Android SDK/NDK, Flutter SDK, Pub y Gradle.
#   4. Si detecta código Rust (`Cargo.toml`) en el proyecto, instala y cachea
#      automáticamente el toolchain de Rust (32 bits armv7 + 64 bits arm64),
#      cargo-ndk y las dependencias de Cargo (`cargo fetch`).
#   5. Descarga las dependencias de Flutter (`flutter pub get`) y compila el APK
#      en modo Debug separado por arquitectura (`--split-per-abi`: 32 y 64 bits).
#   6. Sube dos Artifacts separados (uno para `arm64-v8a` 64 bits y otro para
#      `armeabi-v7a` 32 bits) para descargar solo el que necesites en tu teléfono.
# ==============================================================================

name: Compilar APK Debug (Aura Music)

on:
  # Permite ejecutar la compilación manualmente desde la app móvil de GitHub
  workflow_dispatch:
  # También compila automáticamente al subir cambios a main/master
  push:
    branches:
      - main
      - master
    paths:
      - "aura_music/**"
      - "lib/**"
      - "android/**"
      - "rust/**"
      - "pubspec.yaml"
      - ".github/workflows/build-debug-apk.yml"

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Compilar APK Debug (32 y 64 bits)
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar todo el código del proyecto
      - name: Descargar repositorio completo
        uses: actions/checkout@v4

      # 2. Detectar dónde vive el proyecto Flutter (subcarpeta aura_music o raíz)
      - name: Detectar ruta del proyecto Flutter y Rust
        id: detect
        shell: bash
        run: |
          if [ -f "aura_music/pubspec.yaml" ]; then
            echo "app_dir=aura_music" >> "$GITHUB_OUTPUT"
            APP_DIR="aura_music"
          elif [ -f "pubspec.yaml" ]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            APP_DIR="."
          else
            echo "::error::No se encontró pubspec.yaml ni en aura_music/ ni en la raíz."
            exit 1
          fi

          # Verificar si ya existen archivos Cargo.toml de Rust en el proyecto
          CARGO_PATH=$(find "$APP_DIR" -maxdepth 3 -name "Cargo.toml" | head -n 1 || true)
          if [ -n "$CARGO_PATH" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "rust_manifest=$CARGO_PATH" >> "$GITHUB_OUTPUT"
            echo "rust_dir=$(dirname "$CARGO_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. Configurar Java 17 requerido por Android Gradle Plugin 8+
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Configurar Android SDK nativo del runner y cachear API 35 + NDK 26.3
      #    (No usamos setup-android@v3 porque falla intentando instalar el paquete obsoleto 'tools')
      - name: Configurar rutas de Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "::error::No se encontró sdkmanager en $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Caché de Android SDK (API 36 y NDK 28.2)
        id: cache_android_sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-sdk-36-ndk-28.2.13676358-${{ runner.os }}

      - name: Aceptar licencias e instalar API 36 y NDK si no están en caché
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if [ "${{ steps.cache_android_sdk.outputs.cache-hit }}" != "true" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          fi

      # 5. Configurar Flutter SDK con caché integrada
      - name: Configurar Flutter SDK (con caché)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 6. Caché explícita de paquetes Dart/Pub
      - name: Caché de dependencias Pub (Dart/Flutter)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ steps.detect.outputs.app_dir }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 7. Configurar Gradle con su caché oficial integrada (Flutter 3.50 requiere >= 9.3.1)
      - name: Configurar Gradle y su caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # 8. Rust condicional: solo se instala y descarga si el proyecto contiene Cargo.toml
      - name: Instalar Rust Toolchain (Android 32 y 64 bits) si es necesario
        if: steps.detect.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Caché de Cargo y dependencias Rust
        if: steps.detect.outputs.has_rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ${{ steps.detect.outputs.rust_dir }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Instalar cargo-ndk y descargar crates de Rust
        if: steps.detect.outputs.has_rust == 'true'
        shell: bash
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          cargo fetch --manifest-path "${{ steps.detect.outputs.rust_manifest }}"

      # 9. Descargar dependencias Flutter y generar Gradle Wrapper si falta
      - name: Descargar dependencias Flutter y preparar Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          flutter pub get
          if [ ! -f "android/gradlew" ]; then
            (cd android && gradle wrapper --gradle-version 9.5.0)
          fi
          chmod +x android/gradlew

      # 10. Compilar en modo APK Debug separado por arquitectura (32 bits y 64 bits)
      - name: Compilar APKs Debug por arquitectura
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          flutter build apk --debug --split-per-abi --target-platform android-arm,android-arm64
          ls -lh build/app/outputs/flutter-apk/

      # 11. Subir un Artifact individual para 64 bits (arm64-v8a)
      - name: Publicar Artifact 64 bits (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-arm64-v8a
          path: ${{ steps.detect.outputs.app_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Subir un Artifact individual para 32 bits (armeabi-v7a)
      - name: Publicar Artifact 32 bits (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-armeabi-v7a
          path: ${{ steps.detect.outputs.app_dir }}/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
