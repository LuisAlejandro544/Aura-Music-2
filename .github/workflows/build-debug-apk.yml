# ==============================================================================
# build-debug-apk.yml — GitHub Action para compilar Aura Music en APK Debug
# ------------------------------------------------------------------------------
# Qué hace este workflow:
#   1. Descarga todo el repositorio del proyecto.
#   2. Detecta automáticamente si la app Flutter está en `aura_music/` o en la
#      raíz del repositorio, además del crate Rust (`Cargo.toml`).
#   3. Configura y cachea Java 17, Python 3.11 (Chaquopy), Android SDK/NDK 28.2,
#      Flutter SDK, Pub y Gradle 9.5.0.
#   4. Si detecta código Rust (`Cargo.toml`), instala `libclang-dev` (bindgen),
#      el toolchain Rust (32 bits `armv7` + 64 bits `arm64`), `cargo-ndk` y
#      cachea las dependencias de Cargo (`cargo fetch`).
#   5. Compila dos APKs Debug independientes por arquitectura (`arm64-v8a` y
#      `armeabi-v7a`) usando `--target-platform` (compatible con Chaquopy +
#      `cargo-ndk`, sin conflicto de `splits.abi`).
#   6. Sube dos Artifacts separados (`aura-music-debug-arm64-v8a` y
#      `aura-music-debug-armeabi-v7a`) para descargar solo el necesario en móvil.
# ==============================================================================

name: Compilar APK Debug (Aura Music)

on:
  # Permite ejecutar la compilación manualmente desde la app móvil de GitHub
  workflow_dispatch:
  # También compila automáticamente al subir cambios a main/master
  push:
    branches:
      - main
      - master
    paths:
      - "aura_music/**"
      - "lib/**"
      - "android/**"
      - "rust/**"
      - "pubspec.yaml"
      - ".github/workflows/build-debug-apk.yml"

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Compilar APK Debug (32 y 64 bits)
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar todo el código del proyecto
      - name: Descargar repositorio completo
        uses: actions/checkout@v4

      # 2. Detectar dónde vive el proyecto Flutter y el crate Rust
      - name: Detectar ruta del proyecto Flutter y Rust
        id: detect
        shell: bash
        run: |
          if [ -f "aura_music/pubspec.yaml" ]; then
            echo "app_dir=aura_music" >> "$GITHUB_OUTPUT"
            APP_DIR="aura_music"
          elif [ -f "pubspec.yaml" ]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            APP_DIR="."
          else
            echo "::error::No se encontró pubspec.yaml ni en aura_music/ ni en la raíz."
            exit 1
          fi

          # Buscar Cargo.toml hasta profundidad 4 (ej. aura_music/rust/aura_yt_engine/Cargo.toml)
          CARGO_PATH=$(find "$APP_DIR" -maxdepth 4 -name "Cargo.toml" | head -n 1 || true)
          if [ -n "$CARGO_PATH" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            echo "rust_manifest=$CARGO_PATH" >> "$GITHUB_OUTPUT"
            echo "rust_dir=$(dirname "$CARGO_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. Configurar Java 17 requerido por Android Gradle Plugin 9+
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Configurar Python 3.11 para Chaquopy (soporta 32 bits armeabi-v7a + 64 bits arm64-v8a y yt-dlp)
      - name: Configurar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exportar ruta de Python para Chaquopy
        shell: bash
        run: |
          PYTHON_BIN=$(which python3)
          echo "CHAQUOPY_BUILD_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"
          "$PYTHON_BIN" --version

      # 5. Configurar Android SDK nativo del runner y cachear API 36 + NDK 28.2
      - name: Configurar rutas de Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER_BIN=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "::error::No se encontró sdkmanager en $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Caché de Android SDK (API 36 y NDK 28.2)
        id: cache_android_sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: android-sdk-36-ndk-28.2.13676358-${{ runner.os }}

      - name: Aceptar licencias e instalar API 36 y NDK si no están en caché
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if [ "${{ steps.cache_android_sdk.outputs.cache-hit }}" != "true" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          fi

      # 6. Configurar Flutter SDK con caché integrada
      - name: Configurar Flutter SDK (con caché)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 7. Caché explícita de paquetes Dart/Pub
      - name: Caché de dependencias Pub (Dart/Flutter)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ steps.detect.outputs.app_dir }}/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 8. Configurar Gradle con su caché oficial integrada (AGP 9.3.1 requiere Gradle >= 9.3.1)
      - name: Configurar Gradle y su caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # 9. Rust condicional (rquickjs bindgen + lofty + jni) para 32 y 64 bits
      - name: Instalar libclang-dev para bindgen (QuickJS-ng en Rust)
        if: steps.detect.outputs.has_rust == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          LIBCLANG_SO=$(find /usr/lib -name "libclang.so*" 2>/dev/null | head -n 1 || true)
          if [ -n "$LIBCLANG_SO" ]; then
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")" >> "$GITHUB_ENV"
          fi

      - name: Instalar Rust Toolchain (Android 32 y 64 bits)
        if: steps.detect.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Caché de Cargo y dependencias Rust
        if: steps.detect.outputs.has_rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ${{ steps.detect.outputs.rust_dir }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Instalar cargo-ndk y descargar crates de Rust
        if: steps.detect.outputs.has_rust == 'true'
        shell: bash
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          cargo fetch --manifest-path "${{ steps.detect.outputs.rust_manifest }}"

      # 10. Descargar dependencias Flutter y generar Gradle Wrapper si falta
      - name: Descargar dependencias Flutter y preparar Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          flutter pub get
          if [ ! -f "android/gradlew" ]; then
            (cd android && gradle wrapper --gradle-version 9.5.0)
          fi
          chmod +x android/gradlew

      # 11. Compilar APKs Debug separados por arquitectura (sin --split-per-abi por Chaquopy)
      - name: Compilar APK Debug 64 bits (arm64-v8a)
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          ORG_GRADLE_PROJECT_auraAbi=arm64-v8a flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: Compilar APK Debug 32 bits (armeabi-v7a)
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          rm -rf build/app/intermediates/merged_jni_libs build/app/intermediates/stripped_native_libs build/app/intermediates/assets
          ORG_GRADLE_PROJECT_auraAbi=armeabi-v7a flutter build apk --debug --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Verificar que cada APK Debug contenga únicamente su ABI
        working-directory: ${{ steps.detect.outputs.app_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, zipfile

          checks = [
              ("build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk", "arm64-v8a"),
              ("build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk", "armeabi-v7a"),
          ]

          for apk_path, expected_abi in checks:
              with zipfile.ZipFile(apk_path, "r") as zf:
                  lib_entries = [n for n in zf.namelist() if n.startswith("lib/")]
              abis = sorted({n.split("/")[1] for n in lib_entries if len(n.split("/")) >= 3})
              print(f"{apk_path} -> ABIs en lib/: {abis} ({len(lib_entries)} archivos)")
              if abis != [expected_abi]:
                  print(f"ERROR: Se esperaba únicamente [{expected_abi}], pero se encontró {abis}", file=sys.stderr)
                  sys.exit(1)
              for required in (f"lib/{expected_abi}/libaura_yt_rust.so", f"lib/{expected_abi}/libaura_qjs.so"):
                  if required not in lib_entries:
                      print(f"ERROR: Falta {required} en {apk_path}", file=sys.stderr)
                      sys.exit(1)
          PY

      # 12. Subir un Artifact individual para 64 bits (arm64-v8a)
      - name: Publicar Artifact 64 bits (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-arm64-v8a
          path: ${{ steps.detect.outputs.app_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Subir un Artifact individual para 32 bits (armeabi-v7a)
      - name: Publicar Artifact 32 bits (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: aura-music-debug-armeabi-v7a
          path: ${{ steps.detect.outputs.app_dir }}/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14
